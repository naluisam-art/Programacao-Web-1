<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página Pessoal</title>
    <link rel="stylesheet" href="style.css">
</head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página Pessoal</title>
</head>
<body>

    <!-- CABEÇALHO / CONTEÚDO ANTERIOR DA PÁGINA PESSOAL -->
    <header>
        <h1>Minha Página Pessoal</h1>
        <p>Bem-vindo ao meu site!</p>
    </header>

    <main>
        <!-- Seção Sobre Mim (Exemplo da atividade anterior) -->
        <section id="sobre">
            <h2>Sobre Mim</h2>
            <p>Olá! Esta é a minha página pessoal desenvolvida para a disciplina de Programação Web I.</p>
            <!-- Exibindo a foto da pasta img conforme a estrutura do projeto -->
            <img src="img/foto.jpg" alt="Minha foto de perfil" width="200">
        </section>

        <!-- NOVIDADE DESTA ATIVIDADE: Seção "Entre em contato" -->
        <section id="contato">
            <h2>Entre em contato</h2>
            
            <form action="#" method="POST">
                <!-- Agrupamento de campos relacionados -->
                <fieldset>
                    <legend>Formulário de Contato</legend>

                    <!-- Campo Nome -->
                    <div>
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                    </div>

                    <!-- Campo E-mail -->
                    <div>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required placeholder="seu@email.com">
                    </div>

                    <!-- Campo Assunto -->
                    <div>
                        <label for="assunto">Assunto:</label>
                        <input type="text" id="assunto" name="assunto" required placeholder="Assunto da mensagem">
                    </div>

                    <!-- Campo Mensagem -->
                    <div>
                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>
                    </div>

                    <!-- Botões de Enviar e Limpar -->
                    <div>
                        <button type="submit">Enviar</button>
                        <button type="reset">Limpar</button>
                    </div>

                </fieldset>
            </form>
        </section>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2026 - Meu Projeto</p>
    </footer>

</body>
</html>
